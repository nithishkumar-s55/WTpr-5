<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artsphere | Art Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: white;
            padding: 15px 30px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .navbar a {
            text-decoration: none;
            color: #5b21b6;
            padding: 12px 18px;
            display: block;
            border-radius: 5px;
            transition: 0.3s;
        }

        .navbar a:hover,
        .dropdown.active > a {
            background-color: #7e22ce;
            color: white;
        }

        .dropdown {
            position: relative;
        }

        .dropdown span {
            margin-left: 8px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 160px;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            z-index: 10;
        }

        .dropdown-content a {
            color: #5b21b6;
            padding: 12px 15px;
        }

        .dropdown-content a:hover {
            background-color: #f3e8ff;
            color: #7e22ce;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        @media (max-width: 600px) {
            .navbar {
                flex-wrap: wrap;
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="dropdown active">
            <a href="#">Art Gallery <span>⌄</span></a>

            <div class="dropdown-content">
                <a href="#">Paintings</a>
                <a href="#">Digital Art</a>
                <a href="#">Sculptures</a>
            </div>
        </div>

        <a href="#">Artists</a>

        <a href="#">Exhibitions</a>

        <a href="#">About Us</a>

        <a href="#">Contact</a>

    </nav>

</body>
</html>
